[build]
  command = "node scripts/netlify-build.mjs"
  publish = "netlify-dist/public"
  functions = "netlify-dist/functions"

[build.environment]
  NODE_VERSION = "20"

# API requests → serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
